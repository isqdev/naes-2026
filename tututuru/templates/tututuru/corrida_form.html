{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Corrida{% endblock %}

{% block content %}
<div class="section-head">
  <div class="section-title">{{ titulo }}</div>
  <a class="btn-outline-f1" href="{% url 'tututuru:corrida-lista' %}">Cancelar</a>
</div>

<div class="ds-card">
  <div class="ds-card-title">Formulario</div>
  <form method="post">
    {% csrf_token %}
    {% crispy form %}
    <div class="d-flex gap-2">
      <button type="submit" class="btn-red"><i class="bi bi-check-lg"></i> Salvar</button>
      <a href="{% url 'tututuru:corrida-lista' %}" class="btn-outline-f1">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
