<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Equipe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h1 class="h4 mb-0">Detalhes da Equipe</h1>
            </div>
            <div class="card-body">
                <p><strong>Nome:</strong> {{ equipe.nome }}</p>
                <p><strong>País de origem:</strong> {{ equipe.pais_origem }}</p>
                <p><strong>Ano de fundação:</strong> {{ equipe.ano_fundacao }}</p>
                <p><strong>Motor:</strong> {{ equipe.motor }}</p>
            </div>
            <div class="card-footer d-flex gap-2">
                <a href="{% url 'equipe_update' equipe.pk %}" class="btn btn-warning">Alterar</a>
                <a href="{% url 'equipe_delete' equipe.pk %}" class="btn btn-danger">Excluir</a>
                <a href="{% url 'equipe_list' %}" class="btn btn-secondary">Voltar</a>
            </div>
        </div>
    </div>
</body>
</html>
