{% extends "base.html" %}

{% block title %}Excluir Resultado{% endblock %}

{% block content %}
<div class="section-head">
  <div class="section-title">Excluir Resultado</div>
</div>

<div class="ds-card">
  <div class="ds-card-title">Confirmacao</div>
  <p>Tem certeza que deseja excluir este resultado?</p>
  <form method="post" class="d-flex gap-2">
    {% csrf_token %}
    <button type="submit" class="btn-red"><i class="bi bi-trash"></i> Confirmar exclusao</button>
    <a href="{% url 'tututuru:resultado-lista' %}" class="btn-outline-f1">Cancelar</a>
  </form>
</div>
{% endblock %}
