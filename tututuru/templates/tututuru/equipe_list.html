<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Lista de Equipes</h1>
            <a href="{% url 'equipe_create' %}" class="btn btn-primary">Nova Equipe</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Nome</th>
                            <th>País</th>
                            <th>Ano de Fundação</th>
                            <th>Motor</th>
                            <th class="text-end">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for equipe in equipes %}
                        <tr>
                            <td>{{ equipe.nome }}</td>
                            <td>{{ equipe.pais_origem }}</td>
                            <td>{{ equipe.ano_fundacao }}</td>
                            <td>{{ equipe.motor }}</td>
                            <td class="text-end">
                                <a href="{% url 'equipe_detail' equipe.pk %}" class="btn btn-sm btn-info text-white">Detalhar</a>
                                <a href="{% url 'equipe_update' equipe.pk %}" class="btn btn-sm btn-warning">Alterar</a>
                                <a href="{% url 'equipe_delete' equipe.pk %}" class="btn btn-sm btn-danger">Excluir</a>
                            </td>
                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="5" class="text-center py-3">Nenhuma equipe cadastrada.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
