{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Entrar | tututuru{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 mt-5">
  <div class="col-md-6 col-lg-4">
    <div class="f1-card p-4">
      <h1 class="h3 mb-4">Entrar</h1>
      {% if form.errors %}<div class="f1-alert alert-danger">Usuário ou senha inválidos.</div>{% endif %}
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="btn-red w-100 mt-3" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
