{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Alterar senha | tututuru{% endblock %}

{% block content %}
<div class="row justify-content-center py-5 mt-5">
  <div class="col-md-7 col-lg-5">
    <div class="f1-card p-4">
      <h1 class="h3 mb-4">Alterar senha</h1>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <button class="btn-red mt-3" type="submit">Salvar nova senha</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
